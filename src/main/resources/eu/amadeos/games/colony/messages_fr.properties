about.woodcutter=Abat les grands arbres proches et rapporte les troncs. Il lui faut une hache des outils.
about.forester=Plante de jeunes arbres autour de la maison, pour que le bûcheron ne manque jamais de bois.
about.quarry=Extrait la pierre de la roche proche. Il lui faut une pioche des outils.
about.sawmill=Scie les troncs en planches, la matière de la plupart des maisons.
about.tower=Un guetteur repousse la frontière : de nouvelles terres où bâtir. Son cor fait fuir les loups.
about.well=Puise l’eau pour la boulangerie et les moutons, et éteint les incendies des maisons proches.
about.fisher=Pêche dans l’eau proche ; les poissons reviennent après un temps. Il lui faut une canne.
about.farm=Sème des champs autour de la ferme et récolte le grain. Rien ne pousse en hiver.
about.windmill=Moud le grain en farine.
about.bakery=Cuit le pain avec de la farine et de l’eau.
about.sheepfarm=Le berger et le chien gardent les moutons au pré ; le grain et l’eau deviennent de la laine.
about.weaver=Tisse la laine en tissu.
about.toolmaker=Fait des outils avec des planches et de la pierre. Les outils font des colons des bûcherons, des fermiers et plus.
about.residence=Du pain ou du poisson et du tissu, apportés ici, font un nouveau colon.

