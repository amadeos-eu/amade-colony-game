dialog.about.text=Une vallée verte, un entrepôt et quelques dizaines de colons. Place des maisons, relie-les par des routes et laisse les porteurs amener les marchandises de drapeau en drapeau : les troncs deviennent des planches, le grain de la farine et du pain, la laine du tissu. La nourriture et le tissu dans une maison amènent de nouveaux colons. Trois missions ; la victoire la plus rapide de chacune est enregistrée.
dialog.about.rules=Choisis un bâtiment dans le panneau et clique sur la carte pour le placer ; puis trace sa route, un clic par morceau, de son drapeau à un drapeau ou une route existante. Chaque route a son propre porteur. Bâtisseurs, ouvriers et porteurs viennent de l’entrepôt ; un ouvrier qui a besoin d’outils les attend. Les tours de guet repoussent la frontière. Les puits éteignent les incendies proches, le chien garde les moutons. R trace des routes, F pose un drapeau, Suppr démolit, + et - changent la vitesse, F5 enregistre, F9 charge.

