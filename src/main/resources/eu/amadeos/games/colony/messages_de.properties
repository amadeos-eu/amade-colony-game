about.woodcutter=Fällt große Bäume in der Nähe und bringt die Stämme. Braucht eine Axt aus dem Werkzeug.
about.forester=Pflanzt junge Bäume um das Haus, damit dem Holzfäller das Holz nie ausgeht.
about.quarry=Bricht Stein aus dem Fels in der Nähe. Braucht eine Spitzhacke aus dem Werkzeug.
about.sawmill=Sägt Stämme zu Brettern, dem Stoff, aus dem die meisten Häuser sind.
about.tower=Ein Wächter schiebt die Grenze hinaus, so gibt es neues Land zum Bauen. Sein Horn verscheucht Wölfe.
about.well=Schöpft Wasser für Bäckerei und Schafe und löscht Brände in den Häusern nahebei.
about.fisher=Fängt Fische am Wasser nahebei; die Fische kommen nach einer Weile wieder. Braucht eine Angel.
about.farm=Sät Felder um den Hof und erntet das Korn. Im Winter wächst nichts.
about.windmill=Mahlt Korn zu Mehl.
about.bakery=Backt Brot aus Mehl und Wasser.
about.sheepfarm=Schäfer und Hund hüten Schafe auf der Weide; aus Korn und Wasser wird Wolle.
about.weaver=Webt Wolle zu Stoff.
about.toolmaker=Macht Werkzeug aus Brettern und Stein. Mit Werkzeug werden Siedler zu Holzfällern, Bauern und mehr.
about.residence=Brot oder Fisch und Stoff, hierher gebracht, ergeben einen neuen Siedler.

