dialog.about.text=Ein grünes Tal, ein Lagerhaus und ein paar Dutzend Siedler. Lege Häuser an, verbinde sie mit Straßen und lass die Träger die Waren von Fahne zu Fahne bringen: aus Stämmen werden Bretter, aus Korn Mehl und Brot, aus Wolle Stoff. Essen und Stoff in einem Wohnhaus bringen neue Siedler. Drei Missionen; der schnellste Sieg jeder Mission wird gespeichert.
dialog.about.rules=Wähle ein Gebäude in der Leiste und klicke auf die Karte, um es anzulegen; dann lege seine Straße, ein Klick für jedes Stück, von seiner Fahne zu einer Fahne oder Straße, die es schon gibt. Jede Straße bekommt ihren eigenen Träger. Bauleute, Arbeiter und Träger kommen aus dem Lagerhaus; wer Werkzeug braucht, wartet darauf. Wachtürme schieben die Grenze hinaus. Brunnen löschen Brände in ihrer Nähe, der Hund hütet die Schafe. R legt Straßen, F setzt eine Fahne, Entf reißt ab, + und - ändern das Tempo, F5 speichert, F9 lädt.

