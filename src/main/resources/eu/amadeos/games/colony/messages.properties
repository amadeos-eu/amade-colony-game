dialog.about.text=A green valley, a storehouse and a few dozen settlers. Lay out houses, link them with roads, and let the carriers bring the goods from flag to flag: logs become planks, grain becomes flour and bread, wool becomes cloth. Food and cloth in a residence bring new settlers. Three missions; the fastest win of each is saved.
dialog.about.rules=Choose a building in the panel and click on the map to lay it out; then lay its road, a click for each piece, from its flag to a flag or road there is. Every road gets its own carrier. Builders, workers and carriers come from the storehouse; a worker who needs tools waits for them. Lookout towers move the border. Wells put out fires near them, the dog guards the sheep. R lays roads, F puts down a flag, Delete tears down, + and - change the speed, F5 saves, F9 loads.

title.subtitle=Lay roads · build up the economy · grow the settlement
title.start=Click or press Enter: choose a mission
title.mouse=The panel lays out buildings · a click on the map places them · then a click for each piece of road
title.keys=Arrow keys, the middle button or the edge of the screen move the map · R roads · F flag · Delete tears down
title.load=F9 loads the saved settlement
title.screen=P or Esc pauses · + and - change the speed · F5 saves · F11 full screen · F12 frame times

