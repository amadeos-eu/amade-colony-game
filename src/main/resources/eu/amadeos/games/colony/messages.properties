about.woodcutter=Fells grown trees nearby and brings the logs. Needs an axe from the tools.
about.forester=Plants young trees around the house, so that the woodcutter never runs out.
about.quarry=Breaks stone from the rock nearby. Needs a pick from the tools.
about.sawmill=Saws logs into planks, the goods most houses are built of.
about.tower=A watchman moves the border out, so there is new land to build on. Their horn scares wolves.
about.well=Draws water for the bakery and the sheep, and puts out fires in the houses near it.
about.fisher=Catches fish at the water nearby; the fish come back after a while. Needs a rod.
about.farm=Sows fields around the farm and reaps the grain. Nothing grows in winter.
about.windmill=Grinds grain into flour.
about.bakery=Bakes bread from flour and water.
about.sheepfarm=The shepherd and the dog keep sheep in the pasture; grain and water become wool.
about.weaver=Weaves wool into cloth.
about.toolmaker=Makes tools from planks and stone. Tools turn settlers into woodcutters, farmers and more.
about.residence=Bread or fish and cloth, brought here, make a new settler.

