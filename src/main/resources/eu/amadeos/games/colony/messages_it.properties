about.woodcutter=Abbatte gli alberi grandi vicini e porta i tronchi. Gli serve un’ascia dagli attrezzi.
about.forester=Pianta alberi giovani intorno alla casa, perché al taglialegna non manchi mai il legno.
about.quarry=Spacca la pietra dalla roccia vicina. Gli serve un piccone dagli attrezzi.
about.sawmill=Sega i tronchi in assi, il materiale di quasi tutte le case.
about.tower=Una sentinella sposta il confine: nuova terra per costruire. Il suo corno scaccia i lupi.
about.well=Attinge acqua per il forno e le pecore, e spegne gli incendi nelle case vicine.
about.fisher=Pesca nell’acqua vicina; i pesci tornano dopo un po’. Gli serve una canna.
about.farm=Semina campi intorno alla fattoria e miete il grano. D’inverno non cresce nulla.
about.windmill=Macina il grano in farina.
about.bakery=Cuoce il pane con farina e acqua.
about.sheepfarm=Il pastore e il cane tengono le pecore al pascolo; grano e acqua diventano lana.
about.weaver=Tesse la lana in stoffa.
about.toolmaker=Fa attrezzi con assi e pietra. Gli attrezzi fanno dei coloni taglialegna, contadini e altro.
about.residence=Pane o pesce e stoffa, portati qui, danno un nuovo colono.

