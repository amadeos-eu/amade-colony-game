dialog.about.text=Una valle verde, un magazzino e qualche decina di coloni. Disponi le case, collegale con le strade e lascia che i portatori portino le merci di bandiera in bandiera: i tronchi diventano assi, il grano farina e pane, la lana stoffa. Cibo e stoffa in una casa portano nuovi coloni. Tre missioni; la vittoria più rapida di ognuna viene salvata.
dialog.about.rules=Scegli un edificio nel pannello e fai clic sulla mappa per disporlo; poi traccia la sua strada, un clic per tratto, dalla sua bandiera a una bandiera o strada che c’è già. Ogni strada ha il suo portatore. Costruttori, lavoratori e portatori escono dal magazzino; chi ha bisogno di attrezzi li aspetta. Le torri di guardia spostano il confine. I pozzi spengono gli incendi vicini, il cane fa la guardia alle pecore. R traccia strade, F mette una bandiera, Canc demolisce, + e - cambiano la velocità, F5 salva, F9 carica.

