dialog.about.text=Un valle verde, un almacén y unas docenas de colonos. Coloca casas, únelas con caminos y deja que los porteadores lleven los bienes de bandera en bandera: los troncos se vuelven tablas, el grano harina y pan, la lana tela. La comida y la tela en una vivienda traen colonos nuevos. Tres misiones; se guarda la victoria más rápida de cada una.
dialog.about.rules=Elige un edificio en el panel y haz clic en el mapa para colocarlo; luego traza su camino, un clic por tramo, desde su bandera hasta una bandera o un camino que ya exista. Cada camino tiene su propio porteador. Constructores, trabajadores y porteadores salen del almacén; quien necesita herramientas las espera. Las atalayas mueven la frontera. Los pozos apagan los fuegos cercanos, el perro guarda las ovejas. R traza caminos, F pone una bandera, Supr derriba, + y - cambian la velocidad, F5 guarda, F9 carga.

