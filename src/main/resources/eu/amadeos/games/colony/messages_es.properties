about.woodcutter=Tala los árboles grandes cercanos y trae los troncos. Necesita un hacha de las herramientas.
about.forester=Planta árboles jóvenes alrededor de la casa, para que al leñador nunca le falte madera.
about.quarry=Saca piedra de la roca cercana. Necesita un pico de las herramientas.
about.sawmill=Sierra los troncos en tablas, el material de casi todas las casas.
about.tower=Un vigía mueve la frontera: nueva tierra para construir. Su cuerno espanta a los lobos.
about.well=Saca agua para la panadería y las ovejas, y apaga los fuegos de las casas cercanas.
about.fisher=Pesca en el agua cercana; los peces vuelven al cabo de un rato. Necesita una caña.
about.farm=Siembra campos alrededor de la granja y cosecha el grano. En invierno no crece nada.
about.windmill=Muele el grano en harina.
about.bakery=Hornea pan con harina y agua.
about.sheepfarm=El pastor y el perro guardan las ovejas en el prado; el grano y el agua se vuelven lana.
about.weaver=Teje la lana en tela.
about.toolmaker=Hace herramientas con tablas y piedra. Las herramientas hacen de los colonos leñadores, granjeros y más.
about.residence=Pan o pescado y tela, traídos aquí, dan un colono nuevo.

